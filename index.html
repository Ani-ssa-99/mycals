<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mycals</title>
  <meta name="description" content="Suivi des calories gratuit : photo de ton assiette, scan des codes-barres, objectifs et progrès.">
  <meta name="theme-color" content="#16a36a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mycals">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Journal</span></button>
    <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg><span>Progrès</span></button>
    <button class="fab" id="fab" aria-label="Ajouter un aliment"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="foods"><svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg><span>Aliments</span></button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profil</span></button>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="photo-input-gallery" accept="image/*" hidden>
  <input type="file" id="import-input" accept="application/json,.json" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
